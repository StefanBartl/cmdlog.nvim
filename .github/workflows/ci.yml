name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Gating: stylua + luacheck must pass.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua TESTS

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua

  # Real gate: headless smoke test. lib.nvim and ui.nvim are checked out as
  # siblings so require("lib.nvim...")/require("ui...") resolve.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - name: Checkout cmdlog.nvim
        uses: actions/checkout@v5
        with:
          path: cmdlog.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      # cmdlog.ui.confirm (the soft dependency wrapping the
      # delete-confirmation prompt) and the smoke test's own fallback
      # coverage both require("ui.kit") directly, so ui.nvim has to be
      # reachable the same way lib.nvim is.
      - name: Checkout ui.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: ui.nvim
          ref: ci-verified

      # Optional runtime dependency (picker = "telescope", the default) --
      # checked out so the telescope-specific modules get real require()
      # coverage instead of being skipped. plenary.nvim is telescope's own
      # dependency.
      - name: Checkout telescope.nvim
        uses: actions/checkout@v5
        with:
          repository: nvim-telescope/telescope.nvim
          path: telescope.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 40aedd8a68c78a656a10a8d62d80c54af59420fb

      - name: Checkout plenary.nvim
        uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run smoke test
        working-directory: cmdlog.nvim
        env:
          REPOS_DIR: ${{ github.workspace }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE -l TESTS/smoke_spec.lua
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
